name: CI — Lint, Security Scan, Portal & Real MySQL 8.0 Tests

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Foundation, MySQL 8.0 Migrations & Tests (Node 22)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: mrtumi_test
          MYSQL_USER: mrtumi_test
          MYSQL_PASSWORD: mrtumi_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TZ: Asia/Dhaka
      NODE_ENV: test
      MYSQL_TEST_REQUIRED: "true"
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_DB: mrtumi_test
      MYSQL_TEST_USER: mrtumi_test
      MYSQL_TEST_PASSWORD: mrtumi_test_pw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run foundation lint, EJS compile, migration SQL & secret scan
        run: npm run lint

      - name: Verify MySQL CLI migrator (up -> status -> down 7)
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: |
          set -euo pipefail
          run_and_report() {
            label="$1"
            shift
            if output="$("$@" 2>&1)"; then
              printf '%s\\n' "$output"
            else
              rc=$?
              while IFS= read -r line; do
                echo "::error title=${label}::${line}"
              done <<< "$output"
              exit "$rc"
            fi
          }
          run_and_report 'MySQL migrate up' npm run migrate:up
          run_and_report 'MySQL migration status' npm run migrate:status
          run_and_report 'MySQL migrate down 7' npm run migrate:down -- 7

      - name: Run automated unit, portal regression & live MySQL 8.0 test suites
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.log || {
            awk '/^[[:space:]]*not ok / { remaining=40; print; next } remaining>0 { print; remaining-- }' /tmp/test-output.log | head -n 240 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
