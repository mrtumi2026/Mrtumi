name: CI — Lint, Security, Portal, MySQL 8.0 & MariaDB 10.11 Compatibility

on:
  push:
    branches:
      - main
      - "arena/**"
      - "antigravity/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Foundation, MySQL 8.0 Migrations & Tests (Node 22.23.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: mrtumi_test
          MYSQL_USER: mrtumi_test
          MYSQL_PASSWORD: mrtumi_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TZ: Asia/Dhaka
      NODE_ENV: test
      MYSQL_TEST_REQUIRED: "true"
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_DB: mrtumi_test
      MYSQL_TEST_USER: mrtumi_test
      MYSQL_TEST_PASSWORD: mrtumi_test_pw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "npm"

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install disposable backup/restore client tools
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Run foundation lint, EJS compile, migration SQL & secret scan
        run: npm run lint

      - name: Configure disposable MySQL binlog policy for trigger migrations
        env:
          DB_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: root_ci_password
        run: |
          node <<'NODE'
          const mysql = require('mysql2/promise');
          (async () => {
            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              user: 'root',
              password: process.env.MYSQL_ROOT_PASSWORD,
            });
            try {
              await connection.query('SET GLOBAL log_bin_trust_function_creators = 1');
              console.log('Configured disposable CI MySQL 8.0 to permit the database-scoped migration user to create deterministic audit triggers; no SUPER grant was given to that user.');
            } finally {
              await connection.end();
            }
          })().catch((error) => {
            console.error(`Unable to configure disposable CI MySQL trigger policy: ${error.code || 'ERROR'}: ${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Diagnose MySQL migrations individually on a fresh schema
        id: mysql_migration_diagnosis
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: node scripts/diagnose-migrations.js

      - name: Verify MySQL CLI migrator (up -> status -> reversible down/up cycle)
        id: mysql_migration_cycle
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: |
          set -euo pipefail
          run_and_report() {
            label="$1"
            shift
            echo "::group::${label}"
            if "$@"; then
              echo "::endgroup::"
            else
              rc=$?
              echo "::endgroup::"
              exit "$rc"
            fi
          }
          run_and_report 'MySQL migrate up (idempotent after per-version diagnostic)' npm run migrate:up
          run_and_report 'MySQL migration status' npm run migrate:status
          run_and_report 'MySQL migration status (repeat)' npm run migrate:status
          run_and_report 'MySQL rollback latest two reversible migrations' npm run migrate:down -- 2
          run_and_report 'MySQL migrate up after rollback' npm run migrate:up
          run_and_report 'MySQL migration status after reapply' npm run migrate:status
          run_and_report 'MySQL rollback latest two reversible migrations (leave schema for test isolation)' npm run migrate:down -- 2

      - name: Rehearse logical backup/restore on disposable MySQL 8.0 schema
        id: mysql_backup_restore
        env:
          BACKUP_RESTORE_REHEARSAL: YES_I_AM_USING_A_DISPOSABLE_DATABASE
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: npm run backup:restore:rehearsal

      - name: Report MySQL backup/restore rehearsal disposition
        if: always()
        env:
          MIGRATION_DIAGNOSIS: ${{ steps.mysql_migration_diagnosis.outcome }}
          MIGRATION_CYCLE: ${{ steps.mysql_migration_cycle.outcome }}
          BACKUP_RESTORE: ${{ steps.mysql_backup_restore.outcome }}
        run: |
          if [ "$MIGRATION_DIAGNOSIS" != "success" ]; then
            echo "::error::BACKUP/RESTORE BLOCKED (not run): MySQL migration diagnosis outcome was $MIGRATION_DIAGNOSIS. Migration failure remains the job failure; no backup/restore PASS is claimed."
          elif [ "$MIGRATION_CYCLE" != "success" ]; then
            echo "::error::BACKUP/RESTORE BLOCKED (not run): MySQL migration lifecycle outcome was $MIGRATION_CYCLE. Migration failure remains the job failure; no backup/restore PASS is claimed."
          elif [ "$BACKUP_RESTORE" = "success" ]; then
            echo "MySQL disposable backup/restore rehearsal PASS."
          elif [ "$BACKUP_RESTORE" = "failure" ]; then
            echo "::error::MySQL disposable backup/restore rehearsal FAIL; inspect its own failure logs."
          else
            echo "::error::MySQL disposable backup/restore rehearsal BLOCKED/SKIPPED; outcome=$BACKUP_RESTORE. No PASS is claimed."
          fi

      - name: Run automated unit, portal regression & live MySQL 8.0 test suites
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.log || {
            awk '/^[[:space:]]*not ok / { remaining=40; print; next } remaining>0 { print; remaining-- }' /tmp/test-output.log | head -n 240 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

  mariadb-compatibility:
    name: MariaDB 10.11 Migrations & Integration Tests (Node 22.23.4)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_ci_password
          MARIADB_DATABASE: mrtumi_test
          MARIADB_USER: mrtumi_test
          MARIADB_PASSWORD: mrtumi_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TZ: Asia/Dhaka
      NODE_ENV: test
      MYSQL_TEST_REQUIRED: "true"
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_DB: mrtumi_test
      MYSQL_TEST_USER: mrtumi_test
      MYSQL_TEST_PASSWORD: mrtumi_test_pw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "npm"

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Report exact MariaDB and Node runtime versions
        run: |
          node --version
          npm --version
          node -e "require('mysql2/promise').createConnection({host:'127.0.0.1',user:'root',password:'root_ci_password'}).then(async c => { const [rows] = await c.query('SELECT VERSION() AS version, @@version_comment AS version_comment, @@sql_mode AS sql_mode'); console.log(JSON.stringify(rows[0])); await c.end(); }).catch(e => { console.error(e.code || 'ERROR', e.message); process.exitCode = 1; })"

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install disposable backup/restore client tools
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Run foundation lint, EJS compile, migration SQL & secret scan
        run: npm run lint

      - name: Configure disposable MariaDB trigger policy
        run: |
          node <<'NODE'
          const mysql = require('mysql2/promise');
          (async () => {
            const connection = await mysql.createConnection({
              host: '127.0.0.1', user: 'root', password: 'root_ci_password',
            });
            try {
              await connection.query('SET GLOBAL log_bin_trust_function_creators = 1');
              console.log('Configured only the disposable MariaDB CI service for migration trigger creation.');
            } finally {
              await connection.end();
            }
          })().catch((error) => {
            console.error(`Unable to configure disposable MariaDB trigger policy: ${error.code || 'ERROR'}: ${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Diagnose MariaDB migrations individually on a fresh schema
        id: mariadb_migration_diagnosis
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: node scripts/diagnose-migrations.js

      - name: Verify MariaDB CLI migrator up and status
        id: mariadb_migration_cycle
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: |
          set -euo pipefail
          npm run migrate:up
          npm run migrate:status
          npm run migrate:status
          npm run migrate:down -- 2
          npm run migrate:up
          npm run migrate:status

      - name: Roll back MariaDB migration 0025
        id: mariadb_rollback_0025
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: npm run migrate:down -- 1

      - name: Roll back MariaDB migration 0024
        id: mariadb_rollback_0024
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: npm run migrate:down -- 1

      - name: Reapply migrations after MariaDB rollback
        id: mariadb_reapply_migrations
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: |
          set -euo pipefail
          npm run migrate:up
          npm run migrate:status

      - name: Roll back MariaDB migration 0025 before integration tests
        id: mariadb_rollback_0025_before_tests
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: npm run migrate:down -- 1

      - name: Roll back MariaDB migration 0024 before integration tests
        id: mariadb_rollback_0024_before_tests
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: npm run migrate:down -- 1

      - name: Rehearse logical backup/restore on disposable MariaDB 10.11 schema
        id: mariadb_backup_restore
        env:
          BACKUP_RESTORE_REHEARSAL: YES_I_AM_USING_A_DISPOSABLE_DATABASE
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mrtumi_test
          DB_USER: mrtumi_test
          DB_PASSWORD: mrtumi_test_pw
        run: npm run backup:restore:rehearsal

      - name: Report MariaDB backup/restore rehearsal disposition
        if: always()
        env:
          MIGRATION_DIAGNOSIS: ${{ steps.mariadb_migration_diagnosis.outcome }}
          MIGRATION_CYCLE: ${{ steps.mariadb_migration_cycle.outcome }}
          ROLLBACK_0025: ${{ steps.mariadb_rollback_0025.outcome }}
          ROLLBACK_0024: ${{ steps.mariadb_rollback_0024.outcome }}
          REAPPLY: ${{ steps.mariadb_reapply_migrations.outcome }}
          ROLLBACK_0025_TESTS: ${{ steps.mariadb_rollback_0025_before_tests.outcome }}
          ROLLBACK_0024_TESTS: ${{ steps.mariadb_rollback_0024_before_tests.outcome }}
          BACKUP_RESTORE: ${{ steps.mariadb_backup_restore.outcome }}
        run: |
          for item in             "migration diagnosis:$MIGRATION_DIAGNOSIS"             "migration cycle:$MIGRATION_CYCLE"             "rollback 0025:$ROLLBACK_0025"             "rollback 0024:$ROLLBACK_0024"             "migration reapply:$REAPPLY"             "pre-test rollback 0025:$ROLLBACK_0025_TESTS"             "pre-test rollback 0024:$ROLLBACK_0024_TESTS"; do
            outcome="${item##*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error::BACKUP/RESTORE BLOCKED (not run): MariaDB prerequisite ${item%:*} outcome was $outcome. Migration/lifecycle failure remains visible; no PASS is claimed."
              exit 0
            fi
          done
          if [ "$BACKUP_RESTORE" = "success" ]; then
            echo "MariaDB disposable backup/restore rehearsal PASS."
          elif [ "$BACKUP_RESTORE" = "failure" ]; then
            echo "::error::MariaDB disposable backup/restore rehearsal FAIL; inspect its own failure logs."
          else
            echo "::error::MariaDB disposable backup/restore rehearsal BLOCKED/SKIPPED; outcome=$BACKUP_RESTORE. No PASS is claimed."
          fi

      - name: Run automated unit, portal regression & live MariaDB 10.11 test suites
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.log || {
            awk '/^[[:space:]]*not ok / { remaining=40; print; next } remaining>0 { print; remaining-- }' /tmp/test-output.log | head -n 240 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
